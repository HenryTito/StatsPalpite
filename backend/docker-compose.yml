# Banco de desenvolvimento do StatsPalpite.
#
# A porta é 5433, e não a 5432 padrão, de propósito: outros projetos nesta
# máquina sobem o próprio Postgres na 5432. Com a porta compartilhada, quem
# subisse por último perderia o bind — ou, pior, a aplicação conectaria no
# banco do outro projeto sem avisar.
services:
  postgres:
    image: postgres:16-alpine
    container_name: statspalpite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: statspalpite
      POSTGRES_PASSWORD: statspalpite
      POSTGRES_DB: statspalpite
      # Locale C mantém a ordenação previsível entre máquinas.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5433:5432'
    volumes:
      - statspalpite-data:/var/lib/postgresql/data
      # Cria o banco de teste e as extensões no primeiro start.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U statspalpite -d statspalpite']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  statspalpite-data:
